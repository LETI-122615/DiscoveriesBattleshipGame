name: Notificacao de Pull Request

on:
  pull_request:
    types: [opened, reopened]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Alerta de revisao
        run: |
          echo "Novo Pull Request submetido por ${{ github.actor }}!"
          echo "Titulo: ${{ github.event.pull_request.title }}"
          echo "Por favor, procedam a code review."
